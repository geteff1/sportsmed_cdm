services:
  - type: web
    name: sportsmed-cdm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # 注意：必须单 worker（-w 1），会话状态存在进程内存里；
    # --timeout 180 是因为带教 LLM 评分最长可能跑 90 秒以上
    startCommand: gunicorn -w 1 --threads 8 --timeout 180 -b 0.0.0.0:$PORT app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: ACCESS_CODE
        value: SportsMedCDM2026
      - key: DAILY_LOGIN_LIMIT   # 每天最多成功登录次数，0 为不限
        value: "100"
      - key: DAILY_LLM_LIMIT     # 每天最多大模型请求次数，0 为不限
        value: "200"
      - key: LLM_API_KEY
        sync: false   # 在 Render 控制台手动填写百炼 API Key，不进代码库
